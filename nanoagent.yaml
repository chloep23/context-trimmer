_ > nanoagent.plugin.v0001.ManifestConfig:
id: context-trimmer
name: Context Trimmer
version: 0.1.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  read_conversations:
    description: "Read a conversations file: every conversation, its token limit, and its messages in order with each one's id, role and token count"
  report_trims:
    description: Merge the trimming it is given into this run's reports/<run>/trims.json and return the merged report so far, which the agent submits once every conversation is reported
  trim_key:
    description: Apply the eviction policy to every conversation in a file, giving the kept ids, the evicted ids, the final total and the status
  drop_oldest:
    description: Drop the oldest messages from each conversation until it fits its limit, whatever their role, and say what is left

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  trim-context:
    description: Apply a fixed eviction policy to each conversation in a file and report the kept ids, the evicted ids, the final token total and the status
    runner: agent
    tools: [read_conversations, report_trims, drop_oldest]
    reference: trim_key
    instructions: |-
      Counting. Every token count is a given whole number in the file. A conversation's total is its messages added up. Never estimate a count and never change one.
      Protected. Two kinds of message are never evicted: every message whose role is system, and the last user message in the conversation. An earlier user message is not protected. Everything else can go.
      Nothing to do. If a conversation's total is already at most its limit, evict nothing: the kept list is every id in order, the evicted list is empty, the total is unchanged and the status is unchanged. At exactly the limit there is nothing to do.
      Evicting. Otherwise evict one item at a time and check the total after each one. Stop the moment the total is at most the limit, and never evict more than that needs. First pass: the tool_result messages, oldest first; the tool_call each one answers stays where it is. Second pass, only if it is still over: whatever unprotected messages are left, oldest first. Evicting a tool_call takes its tool_result with it as one step when that result is still there.
      Overflow. If everything unprotected has gone and the total is still over the limit, only the protected messages are left and the status is overflow. Otherwise, if anything was evicted at all, the status is trimmed.
      Reporting order. The kept list is in the conversation's own order, oldest first. The evicted list is in the order things were evicted, which is not the same thing. The total is what the kept messages add up to.
      Plan. Three tool calls, one per step, nothing else: (1) read_conversations, with the task input copied exactly as given; (2) report_trims once, with every conversation; (3) submit. Nothing else is a step. Reason briefly: one short line per conversation, no prose.
      Other tools. drop_oldest removes the oldest messages whatever they are, so it throws the system prompt away first. It is not this policy and its answer is not this answer.
      Submit. When a call returns complete true, call submit with that call's report exactly as returned (task, run, trims), changing nothing. Call submit itself; never write a summary in its place.
